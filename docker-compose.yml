services:
  postgres:
    image: postgres:16-alpine
    container_name: anveshak-postgres
    restart: always
    environment:
      POSTGRES_USER: anveshak_user
      POSTGRES_PASSWORD: anveshak_pass
      POSTGRES_DB: anveshak_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anveshak_user -d anveshak_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: anveshak-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: anveshak-minio
    restart: always
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_password
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: anveshak-minio-init
    depends_on:
      minio:
        condition: service_healthy
    restart: on-failure
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set localhttp http://minio:9000 minio_admin minio_password;
      /usr/bin/mc mb --ignore-existing localhttp/anveshak-private-documents;
      /usr/bin/mc anonymous set private localhttp/anveshak-private-documents;
      exit 0;
      "

volumes:
  postgres_data:
  redis_data:
  minio_data:
